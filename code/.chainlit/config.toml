[project]
user_env = []
session_timeout = 3600
user_session_timeout = 1296000
cache = false
persist_user_env = false
mask_user_env = false
allow_origins = ["*"]

[features]
unsafe_allow_html = false
latex = false
user_message_autoscroll = true
assistant_message_autoscroll = true
auto_tag_thread = true
edit_message = false
allow_thread_sharing = false
favorites = false

[features.spontaneous_file_upload]
    enabled = false

[features.audio]
    enabled = false

[features.mcp]
    enabled = false

[UI]
name = "Braze SDK Demo"
default_theme = "dark"
cot = "full"
custom_css = "/public/stylesheet.css?v=20260217"
custom_js = "/public/custom.js"
confirm_new_chat = true
alert_style = "classic"
logo_file_url = "/public/braze-logo.webp"
default_avatar_file_url = "/public/braze-logo.webp"

[meta]
generated_by = "migration"
